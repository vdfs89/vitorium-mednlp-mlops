<svg width="1280" height="320" viewBox="0 0 1280 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="VITORIUM — End-to-End MLOps Pipeline for Medical Text Classification" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1120"/>
      <stop offset="55%" stop-color="#0d1b2e"/>
      <stop offset="100%" stop-color="#0f2438"/>
    </linearGradient>
    <linearGradient id="titleFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#9fe8dc"/>
    </linearGradient>
    <radialGradient id="glow" cx="82%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#1fb8a6" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#1fb8a6" stop-opacity="0"/>
    </radialGradient>
    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#glow)"/>

  <!-- abstract batch+real-time network motif, right side -->
  <g stroke="#2dd8c4" stroke-opacity="0.35" stroke-width="1.4" filter="url(#softBlur)">
    <line x1="760" y1="70"  x2="900" y2="110"/>
    <line x1="900" y1="110" x2="1040" y2="60"/>
    <line x1="900" y1="110" x2="960" y2="200"/>
    <line x1="960" y1="200" x2="1100" y2="180"/>
    <line x1="960" y1="200" x2="880" y2="260"/>
    <line x1="1100" y1="180" x2="1200" y2="120"/>
    <line x1="1100" y1="180" x2="1180" y2="250"/>
    <line x1="760" y1="70"  x2="820" y2="180"/>
    <line x1="820" y1="180" x2="880" y2="260"/>
  </g>
  <g fill="#7fe9d8">
    <circle cx="760" cy="70"   r="4.5"/>
    <circle cx="900" cy="110"  r="6"/>
    <circle cx="1040" cy="60"  r="4"/>
    <circle cx="960" cy="200"  r="7" fill="#f2b155"/>
    <circle cx="1100" cy="180" r="5.5"/>
    <circle cx="820" cy="180"  r="4"/>
    <circle cx="880" cy="260"  r="5"/>
    <circle cx="1200" cy="120" r="3.5"/>
    <circle cx="1180" cy="250" r="3.5"/>
  </g>

  <!-- wordmark -->
  <text x="72" y="150" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="64" font-weight="700" letter-spacing="4" fill="url(#titleFade)">VITORIUM</text>

  <!-- subtitle -->
  <text x="74" y="190" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#c9d6e3">End-to-End MLOps Pipeline for Medical Text Classification</text>

  <!-- tagline -->
  <text x="74" y="222" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="14" letter-spacing="2" fill="#6fb8ac">MEDICAL NLP · MLOPS · PRODUCTION ML</text>

  <!-- tech badge row -->
  <g font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#9fb2c3">
    <g>
      <rect x="74" y="252" width="76" height="26" rx="13" fill="#132338" stroke="#284457" stroke-width="1"/>
      <text x="112" y="269" text-anchor="middle">FastAPI</text>
    </g>
    <g>
      <rect x="160" y="252" width="66" height="26" rx="13" fill="#132338" stroke="#284457" stroke-width="1"/>
      <text x="193" y="269" text-anchor="middle">Docker</text>
    </g>
    <g>
      <rect x="236" y="252" width="68" height="26" rx="13" fill="#132338" stroke="#284457" stroke-width="1"/>
      <text x="270" y="269" text-anchor="middle">Airflow</text>
    </g>
    <g>
      <rect x="314" y="252" width="96" height="26" rx="13" fill="#132338" stroke="#284457" stroke-width="1"/>
      <text x="362" y="269" text-anchor="middle">Prometheus</text>
    </g>
    <g>
      <rect x="420" y="252" width="72" height="26" rx="13" fill="#132338" stroke="#284457" stroke-width="1"/>
      <text x="456" y="269" text-anchor="middle">Grafana</text>
    </g>
    <g>
      <rect x="502" y="252" width="62" height="26" rx="13" fill="#132338" stroke="#284457" stroke-width="1"/>
      <text x="533" y="269" text-anchor="middle">ONNX</text>
    </g>
  </g>

  <!-- footer strip -->
  <text x="74" y="302" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#4d6274">FIAP Pós-Tech · Machine Learning Engineering · Fase 3 — Cloud and MLOps</text>
</svg>
