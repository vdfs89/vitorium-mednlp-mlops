name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar Poetry
        run: pipx install poetry
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "poetry"
      - run: poetry install --no-root --only main,dev
      - run: poetry run ruff check .

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Poetry
        run: pipx install poetry
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "poetry"
      - run: poetry install --no-root --only main,dev
      - name: Baixar dataset e gerar splits processados
        run: |
          mkdir -p data/raw
          curl -sL -o data/raw/medical_tc_train.csv https://raw.githubusercontent.com/sebischair/Medical-Abstracts-TC-Corpus/main/medical_tc_train.csv
          curl -sL -o data/raw/medical_tc_test.csv https://raw.githubusercontent.com/sebischair/Medical-Abstracts-TC-Corpus/main/medical_tc_test.csv
          PYTHONPATH=. poetry run python -m src.training.preprocess
      - name: Treinar modelo baseline
        run: PYTHONPATH=. poetry run python -m src.training.train
      - name: Exportar modelo para ONNX (com checagem de paridade vs. sklearn)
        run: PYTHONPATH=. poetry run python scripts/export_onnx.py --skip-bench
      - name: Rodar testes (pytest + validacao de schema Pandera)
        run: PYTHONPATH=. poetry run pytest tests/ -v
      - name: Publicar artefato do modelo treinado
        uses: actions/upload-artifact@v4
        with:
          name: model-artifact
          path: |
            models/model.joblib
            models/model.onnx
          retention-days: 7

  build:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Baixar artefato do modelo treinado
        uses: actions/download-artifact@v4
        with:
          name: model-artifact
          path: models/
      - name: Login no GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build e (se for push) publicar a imagem Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/vdfs89/vitorium-mednlp-mlops:latest
            ghcr.io/vdfs89/vitorium-mednlp-mlops:${{ github.sha }}
