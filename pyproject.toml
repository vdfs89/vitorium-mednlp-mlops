[tool.poetry]
name = "vitorium-mednlp-mlops"
version = "0.1.0"
description = "VITORIUM — End-to-End MLOps Pipeline for Medical Text Classification"
authors = ["Vitor Diogo Fonseca da Silva"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115"
uvicorn = { extras = ["standard"], version = "^0.32" }
pydantic = "^2.9"
scikit-learn = "^1.5"
pandas = "^2.2"
joblib = "^1.4"
prometheus-client = "^0.21"
onnxruntime = "^1.19"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
httpx = "^0.27"
ruff = "^0.7"
pandera = "^0.24"
skl2onnx = "^1.17"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["data", "models", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
