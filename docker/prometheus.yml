global:
  scrape_interval: 5s
  evaluation_interval: 15s

# Regras de alerta (montadas pelo docker-compose). Sem Alertmanager: os
# alertas aparecem em http://localhost:9090/alerts; em producao o roteamento
# seria feito via Alertmanager.
rule_files:
  - "/etc/prometheus/alerts.yml"

scrape_configs:
  - job_name: "vitorium-api"
    static_configs:
      - targets: ["api:8000"]
